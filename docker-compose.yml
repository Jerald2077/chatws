services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: chatws-rabbitmq
    hostname: chatws-rabbitmq
    ports:
      - "5672:5672"    # AMQP (spring.rabbitmq.*)
      - "61613:61613"  # STOMP (app.broker.relay.port)
      - "15672:15672"  # consola web -> http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq-data:
