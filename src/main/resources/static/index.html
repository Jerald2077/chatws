<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat WebSocket</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <h2>Chat WebSocket</h2>
        <div id="status" class="disconnected">Desconectado</div>
        <div class="connection-controls">
            <input type="text" id="serverIp" placeholder="IP del servidor" value="localhost">
            <input type="text" id="username" placeholder="Usuario" value="Usuario">
            <button onclick="connect()">Conectar</button>
            <button onclick="disconnect()">Desconectar</button>
        </div>
        <div id="messages"></div>
        <div class="message-controls">
            <input type="text" id="message" placeholder="Escribe un mensaje...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
        <div class="private-controls">
            <input type="text" id="destinatario" placeholder="Destinatario (usuario)">
            <button onclick="sendPrivate()">Enviar privado</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
